# ─────────────────────────────────────────────────────────────
# SERVICE DÙNG CHUNG cho cả server — chạy MỘT LẦN, nhiều project cùng dùng.
# Tên để CHUNG (mysql, redis, proxy), KHÔNG prefix project.
# Tạo network `shared` mà các project (docker-compose.yml) attach vào.
#
#   docker compose -f docker-compose.shared.yml up -d
# ─────────────────────────────────────────────────────────────
name: shared

services:
  # Reverse proxy chung: route theo hostname tới app của từng project.
  proxy:
    image: traefik:v3.1
    container_name: proxy
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=shared
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # HTTPS: Let's Encrypt via TLS-ALPN challenge (needs :443 reachable + DNS pointing here).
      # Resolver name "le" is referenced by each project's router labels (tls.certresolver=le).
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL:?set LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/certs/acme.json
      # Redirect all HTTP → HTTPS.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - proxy-certs:/certs
    networks: [shared]

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [shared]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [shared]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  shared:
    name: shared
    driver: bridge

volumes:
  mysql-data:
    name: shared-mysql-data
  redis-data:
    name: shared-redis-data
  proxy-certs:
    name: shared-proxy-certs
