name: CI

on:
  push:
  pull_request:

# Cancel in-flight runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # apps/api — Laravel 11 (PHP 8.4). Tests run on in-memory SQLite via phpunit.xml.
  # PHP 8.4 (not 8.2): composer.lock pins symfony/* v8.1 (php >=8.4.1), openspout v4.32
  # (~8.3||~8.4||~8.5) and zipstream 3.2 (^8.3) — 8.2 fails `composer install` at the
  # lock platform check. Matches the Docker dev image (php:8.4-cli).
  # ---------------------------------------------------------------------------
  api:
    name: API (Laravel / PHP 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd, zip, intl, exif, pcntl
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install composer dependencies
        # --no-scripts: skip post-autoload-dump (package:discover), which boots the
        # app and opens the DB before .env / the sqlite file exist.
        # Package discovery then happens lazily on the first artisan boot below.
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Prepare environment
        run: |
          cp .env.example .env
          # AppServiceProvider boots Schema::hasTable('settings') — with DB_CONNECTION=sqlite
          # that opens the file, so it must exist (empty is fine: hasTable returns false).
          touch database/database.sqlite
          php artisan key:generate
          php artisan jwt:secret --force

      - name: Run tests
        run: php artisan test

      - name: Check code style (Pint)
        continue-on-error: true
        run: ./vendor/bin/pint --test

  # ---------------------------------------------------------------------------
  # apps/app — Next.js 15 (standalone build). BFF architecture, no client secrets.
  # ---------------------------------------------------------------------------
  app:
    name: App (Next.js 15)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare environment
        run: cp .env.example .env.local

      - name: Build
        run: npm run build
