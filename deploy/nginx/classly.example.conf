# ─────────────────────────────────────────────────────────────────────────────
# Classly — vhost nginx mẫu cho docker-compose.prod.yml (đổi app.example.com thành domain của bạn)
#
# Đích đến:
#   127.0.0.1:8102  →  app Next.js (đứng ở gốc domain)
#   127.0.0.1:8101  →  API Laravel (CHỈ mở đường webhook SePay)
#
# Vì sao API không mở toàn bộ: app Next là BFF — trình duyệt chỉ gọi app cùng origin
# (apps/app/src/lib/api-config.ts:10 hardcode BASE_URL = ''), app mới gọi Laravel qua
# mạng nội bộ Docker. Mở API ra Internet là mở rộng bề mặt tấn công mà không được gì.
#
# Cài:
#   scp file này → /etc/nginx/sites-available/app.example.com
#   ln -s /etc/nginx/sites-available/app.example.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d app.example.com     # tự chèn khối ssl bên dưới
# ─────────────────────────────────────────────────────────────────────────────

server {
    server_name app.example.com;

    # Upload học liệu / ảnh đại diện. Laravel giới hạn riêng ở tầng ứng dụng.
    client_max_body_size 50m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/javascript
        text/css
        text/plain
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # Chặn lộ file nhạy cảm.
    location ~* \.(env|log|key|pem|bak|backup|old|orig|save|swp|tmp|db|sqlite|sqlite3|db-journal|db-wal|db-shm)$ {
        deny all;
        return 404;
    }
    location ~* /(package\.json|tsconfig\.json|composer\.json|composer\.lock|package-lock\.json)$ {
        deny all;
        return 404;
    }

    # ── Đường riêng sang Laravel ────────────────────────────────────────────
    # Webhook SePay — nhà cung cấp gọi từ ngoài vào nên bắt buộc công khai.
    #    Đặt TRƯỚC location /api/ của app: nginx ưu tiên prefix dài hơn, nhưng viết
    #    tường minh để người đọc sau không phải đoán thứ tự.
    location /api/sepay/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Tài nguyên build của Next: cache dài, có hash trong tên file ─────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # ── Mặc định: toàn bộ còn lại về app Next.js ────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8102;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Next dựng trang động (RSC, streaming) — không đệm để trả về ngay.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    listen 80;
}
